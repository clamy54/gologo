# Release : push d'un tag de version (2.2, 2.2.1...) -> executables et paquets des 3 OS -> release GitHub
# en brouillon (installeur Inno Setup, .dmg, .deb).
# Les scripts du depot font tout le travail, ici on orchestre seulement.
# Repetition a blanc : Actions > release > Run workflow (artefacts, pas de release).
name: release

on:
  push:
    # les tags du depot sont le numero de version nu, sans prefixe : 2.1, 2.2...
    tags: ['[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# un seul run par ref ; pas d'annulation en vol (release a moitie faite sinon)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # garde-fou : la version est ecrite a trois endroits (version.go, ressource
  # Windows, installeur). on verifie qu'ils disent la meme chose, et que le tag
  # correspond, avant de bruler des minutes de build
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extraire la version et controler le tag
        id: ver
        run: |
          ver="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' src/logo/version.go)"
          [ -n "$ver" ] || { echo "Version introuvable dans src/logo/version.go" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME != $ver (version.go) : version pas montee ou tag mal nomme" >&2
            exit 1
          fi
          for champ in FileVersion ProductVersion; do
            grep -q "\"$champ\": \"$ver\"" tools/build/versioninfo.json \
              || { echo "$champ de tools/build/versioninfo.json n'est pas en version $ver" >&2; exit 1; }
          done
          maj="${ver%%.*}"; reste="${ver#*.}"; min="${reste%%.*}"
          [ "$(grep -c "\"Major\": $maj, \"Minor\": $min," tools/build/versioninfo.json)" = 2 ] \
            || { echo "FileVersion/ProductVersion de versioninfo.json != $ver" >&2; exit 1; }
          grep -q "#define AppVersion \"$ver\"" dist/windows/gologo.iss \
            || { echo "dist/windows/gologo.iss n'est pas en version $ver" >&2; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: guard
    # amd64. image epinglee : le binaire est lie a la glibc de l'image, monter
    # d'image releve donc la version minimale des distributions visees
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VER: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Dependances systeme (Gio, son)
        run: bash .github/install-deps-linux.sh
      - name: Compiler
        run: bash tools/build/build-linux.sh
      - name: Empaqueter le .deb
        run: bash dist/linux/build-deb.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/build/gologo_*_amd64.deb
          if-no-files-found: error

  build-macos:
    needs: guard
    # arm64 (Apple Silicon), la seule cible Mac distribuee
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VER: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Compiler
        run: bash tools/build/build-macos.sh
      - name: Construire GoLogo.app (signature ad hoc)
        run: bash dist/macos/make-app.sh "$VER"
      - name: Empaqueter le .dmg
        run: bash dist/macos/make-dmg.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos/build/GoLogo-*.dmg
          if-no-files-found: error

  build-windows:
    needs: guard
    runs-on: windows-latest # x64 ; gcc (mingw-w64) est fourni par l'image
    timeout-minutes: 30
    env:
      VER: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Verifier Inno Setup 6
        # preinstalle sur windows-latest, ceinture et bretelles si l'image change
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Compiler
        run: ./tools/build/build-windows.ps1
      - name: Compiler l'installeur
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" dist\windows\gologo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a echoue" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/windows/output/GoLogo-Setup-*.exe
          if-no-files-found: error

  release:
    # publication seulement sur push de tag ; un dispatch reste une repetition a blanc
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [guard, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VER: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Creer la release (brouillon) avec les 3 fichiers
        run: |
          ls -l assets
          notes="$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Windows: the installer is not Authenticode signed, so SmartScreen will call the publisher unknown. Click More info, then Run anyway." \
            "macOS (Apple Silicon, macOS 13 or later): the app is ad-hoc signed, not notarized. Gatekeeper blocks the first launch: open the app once, then go to System Settings > Privacy & Security and click Open Anyway." \
            "Linux (Debian / Ubuntu, amd64): sudo apt install ./gologo_${VER}_amd64.deb" \
            "Changes: https://github.com/${GH_REPO}/commits/${TAG}")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # relance apres echec : la release existe deja, on remplace les fichiers
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --title "$VER" --notes "$notes"
          fi
